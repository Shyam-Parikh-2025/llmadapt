name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (no dependencies to fetch - the library is stdlib-only)
        run: python -m pip install .
      - name: Run the suite
        run: python tests/run_all.py
      - name: CLI smoke test
        run: |
          llmadapt --version
          llmadapt list skills
          llmadapt doctor
